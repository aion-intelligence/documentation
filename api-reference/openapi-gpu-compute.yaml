openapi: 3.0.3
info:
  title: Orchestrator GPU Cluster API
  version: 1.0.0

paths:
  /api/v1/accounts/{accountId}/projects/{projectId}/gpu-clusters:
    post:
      tags: [GpuClusters]
      summary: Create GPU cluster
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: header
          name: x-account-id
          required: false
          schema:
            type: string
        - in: header
          name: x-user-id
          required: false
          schema:
            type: string
        - in: header
          name: X-Request-ID
          required: false
          schema:
            type: string
        - in: header
          name: x-kong-request-id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGpuClusterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGpuClusterResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

    get:
      tags: [GpuClusters]
      summary: List GPU clusters
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: header
          name: x-account-id
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: search
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          schema:
            type: integer
        - in: query
          name: order_by
          required: false
          schema:
            type: string
        - in: query
          name: order_dir
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGpuClustersResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /api/v1/accounts/{accountId}/projects/{projectId}/gpu-clusters/{externalId}:
    get:
      tags: [GpuClusters]
      summary: Get GPU cluster
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            type: string
        - in: header
          name: x-account-id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGpuClusterResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

    delete:
      tags: [GpuClusters]
      summary: Delete GPU cluster
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            type: string
        - in: header
          name: x-account-id
          required: false
          schema:
            type: string
        - in: header
          name: X-Request-ID
          required: false
          schema:
            type: string
        - in: header
          name: x-kong-request-id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteGpuClusterResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

components:
  schemas:
    CreateGpuClusterRequest:
      type: object
      properties:
        cluster_name:
          type: string
        flavor_id:
          type: string
        image_id:
          type: string
        ssh_key_id:
          type: string
        gpu_count:
          type: integer
        pricing_template_id:
          type: string
        user_data:
          type: string
        security_group_ids:
          type: array
          items:
            type: string
      required:
        - cluster_name
        - flavor_id
        - image_id
        - ssh_key_id
        - gpu_count

    ListGpuClustersRequest:
      type: object
      properties:
        status:
          type: string
        search:
          type: string
        limit:
          type: integer
        offset:
          type: integer
        order_by:
          type: string
        order_dir:
          type: string

    GetGpuClusterRequest:
      type: object
      properties:
        external_id:
          type: string
      required:
        - external_id

    DeleteGpuClusterRequest:
      type: object
      properties:
        external_id:
          type: string
      required:
        - external_id

    GpuClusterDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        account_id:
          type: string
        project_id:
          type: string
        metadata:
          type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ServiceResource'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - account_id
        - project_id
        - created_at
        - updated_at

    ServiceResource:
      type: object
      properties:
        external_id:
          type: string
        name:
          type: string
        resource_type:
          type: string
        status:
          type: string
        primary_ip:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - external_id
        - name
        - resource_type
        - status
        - created_at

    ClusterConfiguration:
      type: object
      properties:
        flavor_id:
          type: string
        image_id:
          type: string
        ssh_key_id:
          type: string
        gpu_count:
          type: integer
      required:
        - flavor_id
        - image_id
        - ssh_key_id
        - gpu_count

    NodeNetworkSpecs:
      type: object
      properties:
        public_ip:
          type: string
        private_ip:
          type: string
        network_id:
          type: string

    ClusterNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        resource_type:
          type: string
        flavor_id:
          type: string
        network:
          $ref: '#/components/schemas/NodeNetworkSpecs'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - resource_type
        - flavor_id
        - network
        - created_at
        - updated_at

    ClusterNetwork:
      type: object
      properties:
        network_id:
          type: string
        type:
          type: string
        ip_family:
          type: string
      required:
        - network_id
        - type
        - ip_family

    SecurityGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ClusterResources:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ClusterNode'
        network:
          $ref: '#/components/schemas/ClusterNetwork'
        security_groups:
          type: array
          items:
            $ref: '#/components/schemas/SecurityGroup'
        ssh_key_id:
          type: string
      required:
        - nodes
        - security_groups
        - ssh_key_id

    CreateGpuClusterResponse:
      type: object
      properties:
        cluster:
          $ref: '#/components/schemas/GpuClusterDTO'
        message:
          type: string
        request_id:
          type: string
      required:
        - cluster
        - message

    GetGpuClusterResponse:
      type: object
      properties:
        cluster:
          $ref: '#/components/schemas/GpuClusterDTO'
        message:
          type: string
      required:
        - cluster
        - message

    ListGpuClustersResponse:
      type: object
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/GpuClusterDTO'
        total_count:
          type: integer
          format: int64
        count:
          type: integer
        message:
          type: string
      required:
        - clusters
        - total_count
        - count
        - message

    DeleteGpuClusterResponse:
      type: object
      properties:
        message:
          type: string
        request_id:
          type: string
        deleted_at:
          type: string
          format: date-time
      required:
        - message
        - deleted_at